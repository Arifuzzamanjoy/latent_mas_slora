name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite deliberately avoids torch and never downloads weights, so
      # CI installs only what the pure-logic tests need and finishes in seconds.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff matplotlib numpy

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest tests/ -m "not gpu"

      - name: Check the CLI is wired up
        run: |
          python run_eval.py --list-methods
          python run_eval.py --list-datasets
